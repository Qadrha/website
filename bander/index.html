<style>
:root{--base:#060d1c;--surface:#0c1a2e;--ice:#c8dff0;--cyan:#00c4ff;--green:#34d399;--muted:#7d98b3}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--base)}
body{min-height:100vh;font-family:"Tajawal","SF Pro Display",-apple-system,"Helvetica Neue",system-ui,sans-serif;color:var(--ice);
 background:radial-gradient(120% 70% at 85% -10%,rgba(0,150,255,.30) 0%,rgba(6,13,28,0) 60%),radial-gradient(90% 60% at -10% 100%,rgba(124,58,237,.20) 0%,rgba(6,13,28,0) 60%),var(--base);
 padding:max(20px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom));display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;background-image:radial-gradient(rgba(111,184,232,.11) 1px,transparent 1.2px);background-size:30px 30px;pointer-events:none;mask-image:linear-gradient(180deg,#000,transparent 85%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%)}
.wrap{position:relative;width:100%;max-width:440px}
.lang{display:flex;justify-content:flex-end;gap:6px;margin-bottom:6px}
[dir=rtl] .lang{justify-content:flex-start}
.lang button{font:inherit;font-size:13px;font-weight:700;color:var(--muted);background:rgba(17,34,64,.6);border:1px solid rgba(0,196,255,.18);border-radius:999px;padding:7px 14px;cursor:pointer}
.lang button.on{color:#04121f;background:var(--cyan);border-color:var(--cyan)}
.hero{text-align:center;padding:14px 0 6px}
.mark{position:relative;width:132px;height:132px;margin:0 auto}
.mark:before{content:"";position:absolute;inset:-34px;border-radius:50%;background:radial-gradient(circle,rgba(0,170,255,.45),rgba(0,170,255,0) 65%);filter:blur(6px);animation:breathe 5s ease-in-out infinite}
.mark svg{position:relative;width:100%;height:100%;overflow:visible}
.arc{stroke-dasharray:140;stroke-dashoffset:140;animation:draw 1.4s .15s cubic-bezier(.3,.7,.2,1) forwards}
.tail{opacity:0;animation:pop .5s 1.2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{opacity:1}}
@keyframes breathe{50%{transform:scale(1.12);opacity:.8}}
h1{font-size:34px;font-weight:900;color:#fff;margin-top:20px;letter-spacing:-.5px;line-height:1.15}
.role{font-size:16px;color:var(--cyan);font-weight:700;margin-top:6px}
.loc{font-size:13.5px;color:var(--muted);margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:8px 16px;border-radius:999px;border:1px solid rgba(0,196,255,.3);background:rgba(0,196,255,.08);color:#7fe0ff;font-size:13.5px;font-weight:700}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.desc{margin:16px auto 0;max-width:36ch;font-size:15px;line-height:1.7;color:#a9c3da;text-align:center}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:22px;padding:17px;border-radius:18px;border:0;font:inherit;font-size:17px;font-weight:800;color:#04121f;background:linear-gradient(180deg,#19d0ff,#00aef0);box-shadow:0 14px 34px rgba(0,196,255,.30);text-decoration:none;cursor:pointer;transition:transform .15s}
.cta:active{transform:scale(.98)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn{display:flex;align-items:center;gap:11px;padding:15px 16px;border-radius:16px;text-decoration:none;color:#e6f2fb;font-size:15px;font-weight:700;background:linear-gradient(180deg,rgba(21,42,72,.78),rgba(13,28,50,.78));border:1px solid rgba(0,196,255,.16);transition:transform .15s,border-color .2s}
.btn:active{transform:scale(.98)}.btn:hover{border-color:rgba(0,196,255,.45)}
.ic{width:21px;height:21px;color:var(--cyan);flex:none}.cta .ic{color:#04121f}
.hook{margin-top:22px;padding:20px 18px;border-radius:24px;background:linear-gradient(160deg,rgba(26,56,96,.85),rgba(10,24,46,.9));border:1px solid rgba(0,196,255,.28);display:flex;align-items:center;gap:18px;box-shadow:0 20px 50px rgba(0,0,0,.35),0 0 40px rgba(0,196,255,.10)}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;direction:ltr}
.ring b{font-size:34px;font-weight:900;color:#fff;line-height:1;letter-spacing:-1px}
.ring small{font-size:7px;letter-spacing:1.1px;color:#6fdcff;font-weight:800;margin-top:3px}
.hook p{font-size:19px;font-weight:900;color:#fff;line-height:1.35}
.hook p span{display:block;color:var(--cyan)}
.hook a{display:inline-block;margin-top:9px;font-size:13.5px;font-weight:800;color:#7fe0ff;text-decoration:none}
.share{margin-top:22px;padding:20px;border-radius:22px;background:rgba(12,26,46,.65);border:1px solid rgba(0,196,255,.14);display:flex;align-items:center;gap:18px}
.qrbox{padding:9px;background:#fff;border-radius:14px;flex:none;line-height:0}
.qr{width:104px;height:104px}
.share .t{flex:1}
.share .t small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.share button{margin-top:11px;display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:14px;font-weight:800;color:#e6f2fb;background:rgba(0,196,255,.10);border:1px solid rgba(0,196,255,.3);border-radius:999px;padding:9px 16px;cursor:pointer}
.share button .ic{width:17px;height:17px}
.foot{margin-top:24px;text-align:center;font-size:12px;color:#5f7a94;letter-spacing:.4px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:#102a46;color:#fff;border:1px solid rgba(0,196,255,.4);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:700;transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.rise{opacity:0;transform:translateY(14px);animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.arc{stroke-dashoffset:0}.tail,.rise{opacity:1;transform:none}}
[dir=rtl] .btn,[dir=rtl] .share{flex-direction:row}
</style>
</head>

<script>
(function(){
var D={"en":{"name":"Bander Binkhlaif","role":"Founder · Sima Labs","loc":"Riyadh, Saudi Arabia","pill":"The AI car companion","desc":"One verified record of your car — recalls, warranty, value and a Car Passport — with an advisor that speaks Saudi dialect. Designed and built in Saudi Arabia.","save":"Save contact","email":"Email","call":"Call","wa":"WhatsApp","site":"Website","deck":"Get the deck","app":"Try the app","hook1":"Your car has a score.","hook2":"Ask me what yours is.","score":"QADRHA SCORE","share":"Share this card","scan":"Scan to open","copied":"Link copied","foot":"Designed and built in Saudi Arabia","deckSubject":"Qadrha deck request","deckBody":"Hello, I'd like to receive the Qadrha company deck."},"ar":{"name":"بندر بن خليف","role":"المؤسس · سيما لابس","loc":"الرياض، المملكة العربية السعودية","pill":"رفيقك الذكي لسيارتك","desc":"سجلّ موثّق واحد لسيارتك — الاستدعاءات والضمان والقيمة وجواز السيارة — مع مستشار يتحدث باللهجة السعودية. صُمّم وبُني في المملكة.","save":"حفظ جهة الاتصال","email":"البريد","call":"اتصال","wa":"واتساب","site":"الموقع","deck":"اطلب العرض","app":"جرّب التطبيق","hook1":"لسيارتك تقييم.","hook2":"اسألني كم تقييم سيارتك.","score":"تقييم قدرها","share":"شارك البطاقة","scan":"امسح للفتح","copied":"تم نسخ الرابط","foot":"صُمّم وبُني في المملكة","deckSubject":"طلب العرض التعريفي لقدرها","deckBody":"السلام عليكم، أرغب في استلام العرض التعريفي لقدرها."}};
var lang="en";
try{var s=localStorage.getItem("lang");if(s)lang=s;else if((navigator.language||"").toLowerCase().indexOf("ar")===0)lang="ar";}catch(e){if((navigator.language||"").toLowerCase().indexOf("ar")===0)lang="ar";}
function apply(l){
  lang=l;var d=D[l];
  document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-k]").forEach(function(e){e.textContent=d[e.getAttribute("data-k")];});
  document.querySelectorAll(".lang button").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-l")===l);});
  document.getElementById("deck").href="mailto:hello@qadrha.com?subject="+encodeURIComponent(d.deckSubject)+"&body="+encodeURIComponent(d.deckBody);
  document.title=d.name+" — Qadrha";
  try{localStorage.setItem("lang",l);}catch(e){}
}
document.querySelectorAll(".lang button").forEach(function(b){b.addEventListener("click",function(){apply(b.getAttribute("data-l"));});});
apply(lang);
// score count-up
var C=2*Math.PI*41,arc=document.getElementById("arc87"),n=document.getElementById("n"),t0=null,T=1600,reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function step(ts){if(!t0)t0=ts;var p=Math.min((ts-t0)/T,1),e=1-Math.pow(1-p,3),v=87*e;n.textContent=Math.round(v);arc.setAttribute("stroke-dasharray",(C*v/100)+" 999");if(p<1)requestAnimationFrame(step);}
if(reduce){n.textContent=87;arc.setAttribute("stroke-dasharray",(C*.87)+" 999");}else{setTimeout(function(){requestAnimationFrame(step);},1300);}
// share
var toast=document.getElementById("toast");
function say(m){toast.textContent=m;toast.classList.add("on");setTimeout(function(){toast.classList.remove("on");},1800);}
document.getElementById("shareBtn").addEventListener("click",function(){
  var data={title:D[lang].name+" · Qadrha",text:D[lang].pill+" — qadrha.com",url:"https://qadrha.com/bander"};
  if(navigator.share){navigator.share(data).catch(function(){});}
  else if(navigator.clipboard){navigator.clipboard.writeText(data.url).then(function(){say(D[lang].copied);});}
});
})();
</script>
